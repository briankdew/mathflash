<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>speechCapture</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    button { padding: 10px 14px; border: 1px solid #bbb; background: #fff; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .center-stack { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .problem-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .problem-display { margin: 0; }
    .problem-text { display: inline-block; width: 7ch; text-align: center; }
    .blink-dot {
      width: 1em;
      height: 1em;
      border-radius: 50%;
      background: #c33;
      opacity: 0;
    }
    .counter-text { font-weight: 400; margin: 0; }
    .button-row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
    .answer-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .blink-row { display: flex; gap: 8px; align-items: center; justify-content: center; }
    input[type="text"] {
      width: 120px;
      font-size: 20px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #bbb;
    }
    #feed {
      margin-top: 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      min-height: 240px;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.35;
      background: #fafafa;
      overflow: auto;
    }
    .hint { color: #555; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>speechCapture</h1>

  <div class="center-stack">
    <div class="problem-row">
      <h1 id="problemDisplay" class="problem-display problem-text"></h1>
      <span id="blinkDot" class="blink-dot"></span>
      <h1 id="problemCounter" class="problem-display counter-text">0</h1>
    </div>
    <div class="answer-wrap">
      <label for="answerInput">Answer:</label>
      <input id="answerInput" type="text" inputmode="numeric" autocomplete="off" maxlength="4" disabled />
    </div>

    <div class="button-row">
      <button id="startEndBtn">Start</button>
      <button id="micToggleBtn" aria-pressed="false">Type</button>
    </div>

    <div class="blink-row">
      <label for="blinkRateInput">Blink rate (s):</label>
      <input id="blinkRateInput" type="number" min="0.1" max="5.0" step="0.1" value="2.0" />
    </div>
  </div>

  <div class="hint">
    - Start enables input; End disables input.<br>
    - Mic On = voice-only (typing disabled). Mic Off = typed-only (speech disabled).<br>
    - Any accepted single digit auto-submits and is logged below.
  </div>

  <div class="row" style="justify-content: flex-start; margin-top: 12px;">
    <button id="downloadLogBtn">Download log</button>
  </div>

  <div id="feed" aria-label="Real-time input feed"></div>

<script>
(() => {
  // -----------------------------
  // State
  // -----------------------------
  let sessionActive = false;
  let micOn = false;

  let recognition = null;
  let recognizing = false;
  let lastFinalTranscript = '';
  let nudgeTimerId = 0;

  const MODE_LEARN = 'learn';
  const MODE_EVAL = 'eval';
  const MODE_CHALLENGE = 'challenge';
  let mode = MODE_LEARN;

  const startEndBtn = document.getElementById('startEndBtn');
  const micToggleBtn = document.getElementById('micToggleBtn');
  const answerInput = document.getElementById('answerInput');
  const feed = document.getElementById('feed');
  const downloadLogBtn = document.getElementById('downloadLogBtn');
  const problemDisplay = document.getElementById('problemDisplay');
  const blinkDot = document.getElementById('blinkDot');
  const blinkRateInput = document.getElementById('blinkRateInput');
  const problemCounter = document.getElementById('problemCounter');

  // -----------------------------
  // Utilities
  // -----------------------------
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function buildFacts() {
    const facts = [];
    for (let a = 1; a <= 12; a++) {
      for (let b = a; b <= 12; b++) {
        facts.push({ a, b });
      }
    }
    return facts;
  }

  let factQueue = [];
  let factIndex = 0;
  let spaceCount = 0;
  let blinkTimerId = 0;
  let blinkHideTimerId = 0;
  let blinkOn = false;
  let speechStarted = false;
  let currentAnswer = null;
  let awaitingSubmission = false;

  function resetFacts() {
    factQueue = shuffle(buildFacts());
    factIndex = 0;
  }

  function showNextFact() {
    if (!problemDisplay || !sessionActive) return false;
    if (awaitingSubmission) return false;
    if (factQueue.length === 0 || factIndex >= factQueue.length) resetFacts();

    const fact = factQueue[factIndex++];
    const swap = Math.random() < 0.5;
    const left = swap ? fact.b : fact.a;
    const right = swap ? fact.a : fact.b;
    problemDisplay.textContent = `${left} x ${right}`;
    currentAnswer = fact.a * fact.b;
    lastFinalTranscript = '';
    awaitingSubmission = true;
    return true;
  }

  function advanceProblem(logAuto) {
    if (!showNextFact()) return false;
    spaceCount += 1;
    if (problemCounter) problemCounter.textContent = String(spaceCount);
    if (logAuto) logLine('AUTO-NEXT', `Problem ${spaceCount} (Ans: ${currentAnswer})`);
    else if (mode === MODE_LEARN) logLine('CURRENT_PROB', `Problem ${spaceCount} (Ans: ${currentAnswer})`);
    if (mode === MODE_LEARN) startRecognitionForCurrentProblem();
    return true;
  }

  function startBlinkTimer(seconds) {
    if (!blinkDot) return;
    if (blinkTimerId) clearInterval(blinkTimerId);
    if (blinkHideTimerId) clearTimeout(blinkHideTimerId);
    blinkOn = false;
    blinkDot.style.opacity = '0';

    const ms = Math.max(100, Math.min(5000, Math.round(seconds * 1000)));
    const show = () => {
      blinkOn = true;
      blinkDot.style.opacity = '1';
      if (sessionActive && mode === MODE_EVAL) {
        advanceProblem(true);
      }
      if (blinkHideTimerId) clearTimeout(blinkHideTimerId);
      blinkHideTimerId = setTimeout(() => {
        blinkOn = false;
        blinkDot.style.opacity = '0';
      }, 500);
    };

    show();
    blinkTimerId = setInterval(show, ms);
  }

  function stopBlinkTimer() {
    if (blinkTimerId) clearInterval(blinkTimerId);
    if (blinkHideTimerId) clearTimeout(blinkHideTimerId);
    blinkTimerId = 0;
    blinkHideTimerId = 0;
    blinkOn = false;
    if (blinkDot) blinkDot.style.opacity = '0';
  }

  function ts() {
    const d = new Date();
    return d.toLocaleTimeString(undefined, { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
  }

  function logLine(kind, text) {
    feed.textContent += `[${ts()}] ${kind}: ${text}\n`;
    feed.scrollTop = feed.scrollHeight;
  }

  function setAnswerBoxEnabled(enabled) {
    answerInput.disabled = !enabled;
    if (enabled) answerInput.focus();
    if (!enabled) answerInput.value = '';
  }

  function setTypedModeUI() {
    micToggleBtn.textContent = micOn ? 'Speak' : 'Type';
    micToggleBtn.setAttribute('aria-pressed', String(micOn));

    if (micOn) {
      micToggleBtn.style.borderColor = '#c33';
      // When Mic On, typed input is not allowed:
      answerInput.readOnly = true;
    } else {
      micToggleBtn.style.borderColor = '#2b7';
      answerInput.readOnly = false;
    }
  }

  // Normalize spoken/typed number up to 1000 (digits or common word forms)
  function normalizeToNumber(raw) {
    if (raw == null) return null;
    const s = String(raw).trim().toLowerCase();

    // Direct number present (e.g., "42", "1,000", "1 000")
    const m = s.match(/\b(\d[\d,\s]{0,6}\d|\d)\b/);
    if (m) {
      const cleaned = m[1].replace(/[,\s]/g, '');
      const val = parseInt(cleaned, 10);
      return (val >= 0 && val <= 1000) ? String(val) : null;
    }

    // Word parsing up to 1000
    const units = {
      'zero': 0, 'oh': 0,
      'one': 1, 'two': 2, 'to': 2, 'too': 2,
      'three': 3, 'four': 4, 'for': 4,
      'five': 5, 'six': 6, 'seven': 7,
      'eight': 8, 'ate': 8, 'nine': 9
    };
    const teens = {
      'ten': 10, 'eleven': 11, 'twelve': 12, 'thirteen': 13, 'fourteen': 14,
      'fifteen': 15, 'sixteen': 16, 'seventeen': 17, 'eighteen': 18, 'nineteen': 19
    };
    const tens = {
      'twenty': 20, 'thirty': 30, 'forty': 40, 'fifty': 50,
      'sixty': 60, 'seventy': 70, 'eighty': 80, 'ninety': 90
    };

    const tokens = s.split(/[^a-z]+/).filter(Boolean);
    if (!tokens.length) return null;

    let total = 0;
    let current = 0;
    let found = false;
    let onlyUnits = true;
    const unitDigits = [];

    for (const t of tokens) {
      if (t === 'and') continue;
      if (teens[t] != null) {
        current += teens[t];
        found = true;
        onlyUnits = false;
      } else if (tens[t] != null) {
        current += tens[t];
        found = true;
        onlyUnits = false;
      } else if (units[t] != null) {
        current += units[t];
        unitDigits.push(units[t]);
        found = true;
      } else if (t === 'hundred') {
        if (current === 0) current = 1;
        current *= 100;
        found = true;
        onlyUnits = false;
      } else if (t === 'thousand') {
        if (current === 0) current = 1;
        total += current * 1000;
        current = 0;
        found = true;
        onlyUnits = false;
      } else {
        return null;
      }
    }

    if (onlyUnits && unitDigits.length > 1) {
      const combined = parseInt(unitDigits.join(''), 10);
      return (combined >= 0 && combined <= 1000) ? String(combined) : null;
    }

    total += current;
    return (found && total >= 0 && total <= 1000) ? String(total) : null;
  }

  function submitDigit(digit, source) {
    if (!sessionActive) return;

    // Replace value (never append)
    answerInput.value = digit;

    // Auto-submit immediately
    logLine('SUBMIT', `${digit}  (source=${source})`);
    awaitingSubmission = false;
    if (mode === MODE_LEARN) advanceProblem(false);

    // Clear quickly so you can see if duplicates happen later
    answerInput.value = '';
    if (!micOn) answerInput.focus();
  }

  // -----------------------------
  // Speech Recognition Setup
  // -----------------------------
  function initRecognitionIfPossible() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      logLine('INFO', 'Web Speech API SpeechRecognition not available in this browser.');
      return null;
    }

    const r = new SR();
    r.lang = 'en-US';
    r.continuous = false;      // capture a single utterance per start
    r.interimResults = true;   // emit interim results for debugging
    r.maxAlternatives = 1;

    r.onstart = () => { recognizing = true; logLine('REC', 'onstart'); };
    r.onend = () => {
      recognizing = false;
      logLine('REC', 'onend');
      restartRecognitionIfAwaiting();
    };
    r.onerror = (e) => { logLine('REC_ERR', `${e.error}${e.message ? ' - ' + e.message : ''}`); };
    r.onaudiostart = () => {
      speechStarted = true;
      logLine('REC', 'onaudiostart');
      if (sessionActive && mode === MODE_LEARN && !awaitingSubmission && !problemDisplay.textContent) {
        advanceProblem(false);
      }
    };
    r.onaudioend = () => logLine('REC', 'onaudioend');
    r.onspeechstart = () => logLine('REC', 'onspeechstart');
    r.onspeechend = () => {
      if (nudgeTimerId) {
        clearTimeout(nudgeTimerId);
        nudgeTimerId = 0;
      }
      logLine('REC', 'onspeechend');
    };
    r.onsoundstart = () => logLine('REC', 'onsoundstart');
    r.onsoundend = () => logLine('REC', 'onsoundend');
    r.onnomatch = () => logLine('REC', 'onnomatch');

    r.onresult = (event) => {
      // Only act if we're in voice-only mode and session is active
      if (!sessionActive || !micOn) return;

      // Consume ONLY new results from resultIndex onward (prevents reprocessing)
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const res = event.results[i];
        const top = res[0];
        const transcript = (top && top.transcript) ? top.transcript : '';
        const conf = (top && typeof top.confidence === 'number') ? top.confidence.toFixed(3) : 'n/a';

        logLine('REC_RES', `i=${i} final=${res.isFinal} conf=${conf} txt="${transcript.trim()}"`);

        if (!res.isFinal) {
          if (nudgeTimerId) clearTimeout(nudgeTimerId);
          nudgeTimerId = setTimeout(() => {
            logLine('NUDGE', 'Answer not recognized. Try again, and speak clearly.');
            nudgeTimerId = 0;
          }, 2100);
        }

        if (res.isFinal) {
          if (nudgeTimerId) {
            clearTimeout(nudgeTimerId);
            nudgeTimerId = 0;
          }
          const cleaned = transcript.trim().toLowerCase();
          if (cleaned && cleaned === lastFinalTranscript) continue;
          lastFinalTranscript = cleaned;
          const val = normalizeToNumber(transcript);
          if (val != null) {
            submitDigit(val, 'voice');
          }
        }
      }
    };

    return r;
  }

  function startRecognition() {
    if (!recognition) recognition = initRecognitionIfPossible();
    if (!recognition) return;

    if (recognizing) return;
    try {
      recognition.start();
      logLine('REC', 'start() called');
    } catch (e) {
      // start() can throw if called too quickly after an end
      logLine('REC_ERR', `start() threw: ${e && e.message ? e.message : String(e)}`);
    }
  }

  function stopRecognition() {
    if (!recognition) return;
    if (!recognizing) return;
    try {
      recognition.stop();
      logLine('REC', 'stop() called');
    } catch (e) {
      logLine('REC_ERR', `stop() threw: ${e && e.message ? e.message : String(e)}`);
    }
  }

  function startRecognitionForCurrentProblem() {
    if (!sessionActive || !micOn || mode !== MODE_LEARN) return;
    if (!awaitingSubmission) return;
    if (recognizing) return;
    startRecognition();
  }

  function restartRecognitionIfAwaiting() {
    if (!sessionActive || !micOn || mode !== MODE_LEARN) return;
    if (!awaitingSubmission) return;
    // tiny delay avoids "start called too soon" errors
    setTimeout(() => {
      startRecognitionForCurrentProblem();
    }, 150);
  }

  // -----------------------------
  // UI Events
  // -----------------------------
  startEndBtn.addEventListener('click', () => {
    sessionActive = !sessionActive;

    if (sessionActive) {
      startEndBtn.textContent = 'End';
      setAnswerBoxEnabled(true);
      feed.textContent = '';
      spaceCount = -1;
      if (problemCounter) problemCounter.textContent = String(spaceCount);
      if (problemDisplay) problemDisplay.textContent = '';
      speechStarted = false;
      currentAnswer = null;
      awaitingSubmission = false;
      lastFinalTranscript = '';
      resetFacts();
      logLine('SESSION', 'Start (active)');
      startBlinkTimer(parseFloat(blinkRateInput?.value) || 1.0);

      if (mode === MODE_LEARN) advanceProblem(false);
    } else {
      startEndBtn.textContent = 'Start';
      setAnswerBoxEnabled(false);
      logLine('SESSION', 'End (idle)');
      stopBlinkTimer();
      if (problemDisplay) problemDisplay.textContent = '';
      speechStarted = false;
      currentAnswer = null;
      awaitingSubmission = false;

      stopRecognition();
    }
  });

  micToggleBtn.addEventListener('click', () => {
    micOn = !micOn;
    setTypedModeUI();
    logLine('MIC', micOn ? 'On (voice-only)' : 'Off (typed-only)');

    // Enforce mode immediately
    if (micOn) {
      // Clear any partial typed value (optional; keeps behavior crisp)
      answerInput.value = '';
      if (sessionActive && mode === MODE_LEARN && !awaitingSubmission) {
        advanceProblem(false);
      } else if (sessionActive) {
        startRecognitionForCurrentProblem();
      }
    } else {
      stopRecognition();
      if (sessionActive) answerInput.focus();
    }
  });

  // Typed input: enforce numeric-only and auto-submit
  answerInput.addEventListener('input', (e) => {
    if (!sessionActive) return;
    if (micOn) {
      // Voice-only mode: ignore any typed input (and keep it empty)
      answerInput.value = '';
      return;
    }

    const val = normalizeToNumber(answerInput.value);
    if (val == null) {
      // If not a digit, clear
      answerInput.value = '';
      return;
    }

    // Force normalized numeric display before submit
    answerInput.value = val;
    submitDigit(val, 'typed');
  });

  // Prevent non-digit key presses in typed mode (optional hardening)
  answerInput.addEventListener('keydown', (e) => {
    if (answerInput.disabled) return;
    if (micOn) {
      e.preventDefault();
      return;
    }

    const allowed = [
      'Backspace','Delete','ArrowLeft','ArrowRight','Tab','Enter'
    ];
    if (allowed.includes(e.key)) return;

    // Allow digits only
    if (!/^[0-9]$/.test(e.key)) e.preventDefault();
  });

  // -----------------------------
  // Init UI
  // -----------------------------
  setTypedModeUI();
  logLine('INFO', 'Ready. Press Start.');
  stopBlinkTimer();

  if (downloadLogBtn) {
    downloadLogBtn.addEventListener('click', () => {
      if (!feed.textContent) return;
      const blob = new Blob([feed.textContent], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `speechCapture_log_${new Date().toISOString().slice(0,10)}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  }

  document.addEventListener('keydown', (e) => {
    if (e.code !== 'Space') return;
    e.preventDefault();
    const advanced = advanceProblem(false);
    if (sessionActive && advanced) logLine('SPACE', 'Next problem');
  });

  if (blinkRateInput) {
    blinkRateInput.addEventListener('change', () => {
      const val = parseFloat(blinkRateInput.value);
      if (isNaN(val)) return;
      const clamped = Math.max(0.1, Math.min(5.0, val));
      blinkRateInput.value = clamped.toFixed(1);
      if (sessionActive) startBlinkTimer(clamped);
    });
  }
})();
</script>
</body>
</html>
