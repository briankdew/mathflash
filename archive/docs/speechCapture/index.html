<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>speechCapture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>speechCapture</h1>
  <div class="row" style="margin-bottom: 12px; justify-content: flex-start;">
    <label class="setting-label" for="modeSelect">Mode</label>
    <select id="modeSelect">
      <option value="learn">Learning</option>
      <option value="eval">Evaluation</option>
      <option value="challenge">Challenge</option>
    </select>
    <label class="setting-label" for="sttEngineSelect">  STT</label>
    <select id="sttEngineSelect">
      <option value="whisper" selected>Whisper</option>
    </select>
    <span id="sttStatus" class="stt-status"></span>
    <label class="setting-label" for="blinkToggleSelect">  Blink</label>
    <select id="blinkToggleSelect">
      <option value="on">On</option>
      <option value="off" selected>Off</option>
    </select>
    <label class="setting-label" for="blinkRateInput">  Rate</label>
    <input id="blinkRateInput" type="number" min="0.1" max="10.0" step="0.1" value="2.0" />
    <span id="blinkDot" class="blink-dot"></span>
    <label class="setting-label" for="problemCountInput">Problems</label>
    <input id="problemCountInput" type="number" min="1" max="200" step="1" value="10" />
  </div>
  <div class="row" style="margin-bottom: 12px; justify-content: flex-start;">
    <label class="setting-label" for="operationSelect">Operation</label>
    <select id="operationSelect">
      <option value="add" selected>Addition</option>
      <option value="mul">Multiplication</option>
    </select>
    <label class="setting-label" for="missingValueSelect">  Missing value</label>
    <select id="missingValueSelect">
      <option value="operands">Operands</option>
      <option value="result" selected>Result</option>
      <option value="none">None</option>
    </select>
    <label class="setting-label" for="onErrorSelect">  On error</label>
    <select id="onErrorSelect">
      <option value="new" selected>New problem</option>
      <option value="skip">Omit problem</option>
    </select>
  </div>

  <div class="center-stack">
    <div class="problem-no-row">
      <div class="problem-no-label">Problem no.</div>
      <div id="problemCounter" class="problem-no-value">0</div>
    </div>
    <div class="equation-row">
      <div id="leftOperand" class="operand-box"><span id="leftOperandValue" class="operand-value"></span></div>
      <div id="operatorBox" class="operator-box"></div>
      <div id="rightOperand" class="operand-box"><span id="rightOperandValue" class="operand-value"></span></div>
    </div>
    <div class="result-row">
      <div id="resultBox" class="result-box">
        <span id="resultValue"></span>
        <div id="beginPrompt" class="begin-prompt is-hidden">Say "Begin" to start.</div>
      </div>
    </div>
    <div class="answer-stack">
      <div class="answer-label">Answer</div>
      <input id="answerInput" class="answer-input" type="text" inputmode="numeric" autocomplete="off" maxlength="4" disabled />
    </div>

    <div class="button-row">
      <label class="test-run-toggle" for="testRunToggle" title="Test-run logging to server">
        <span class="test-run-label">Test run</span>
        <input id="testRunToggle" type="checkbox" />
        <span class="test-run-switch" aria-hidden="true">
          <span class="test-run-knob"></span>
        </span>
      </label>
      <button id="startEndBtn">Start</button>
      <button id="micToggleBtn" aria-pressed="false">Type</button>
    </div>
  </div>

  <div class="row" style="justify-content: flex-start; margin-top: 5px;">
    <button id="downloadLogBtn" class="small-button">Download log</button>
  </div>

  <div id="feed" class="feed-window" aria-label="Real-time input feed"></div>

  <section class="vaa-section" aria-label="View Analyze Archive utility">
    <div class="vaa-inner">
      <div class="vaa-header-wrap">
        <div class="vaa-header-row">
          <div class="vaa-title">View, Analyze &amp; Archive</div>
          <div id="vaaStatus" class="vaa-status" aria-live="polite"></div>
          <div class="vaa-header-actions">
            <button id="vaaProcessBtn">Process selected items</button>
          </div>
        </div>
      </div>
      <div id="vaaPanel" class="vaa-panel">
        <div class="vaa-table-wrap">
          <table class="vaa-table">
            <colgroup>
              <col class="vaa-col-view">
              <col class="vaa-col-filename">
              <col class="vaa-col-scope">
              <col class="vaa-col-timestamp">
              <col class="vaa-col-type">
              <col class="vaa-col-analyze">
              <col class="vaa-col-archive">
            </colgroup>
            <thead>
              <tr>
                <th>View</th>
                <th class="vaa-filename-header">
                  <button id="vaaLoadBtn" class="vaa-load-btn" title="Load/refresh available files" aria-label="Load/refresh available files">🗘</button>
                  <span>Filename</span>
                </th>
                <th>Scope</th>
                <th>Timestamp</th>
                <th>Type</th>
                <th>Alyz</th>
                <th>Achv</th>
              </tr>
            </thead>
            <tbody id="vaaTableBody"></tbody>
          </table>
        </div>
        <div class="vaa-view-wrap">
          <div id="vaaViewPane" class="vaa-view-pane">No files selected to view.</div>
        </div>
      </div>
    </div>
  </section>

<script src="speech-processing.js"></script>
<script src="adapters/stt-adapter-manager.js"></script>
<script src="adapters/webspeech.js"></script>
<script src="adapters/vosk.js"></script>
<script src="adapters/whisper.js"></script>
<script src="app-state-and-ui.js"></script>
</body>
</html>
